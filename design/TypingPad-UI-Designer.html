<head>

<style>

ink);cursor:pointer;font:inherit;font-size:11px}.addgrid button:hover{border-color:#8db5ee;background:#edf5ff}.section-label{font-size:11px;color:#8190a4;margin:13px 2px 6px}.layers{display:flex;flex-direction:column;gap:3px}.layer{height:29px;border:0;background:transparent;border-radius:5px;text-align:left;padding:0 8px;color:#53647b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:inherit;font-size:11px;cursor:pointer}.layer:hover{background:#f3f6fa}.layer.selected{background:#eaf2ff;color:#175dbd;font-weight:650}.stage-wrap{min-height:0;overflow:auto;border:1px solid #d1dae7;border-radius:9px;background:#e5eaf1;display:flex;align-items:flex-start;justify-content:center;padding:16px}.sizer{position:relative;flex:none}.board{position:absolute;top:0;left:0;width:1200px;height:1000px;transform-origin:top left;overflow:hidden;background:#f4f7fb;box-shadow:0 5px 24px #25364d24;border:1px solid #ccd6e3;border-radius:8px;user-select:none}.board.grid-on{background-image:linear-gradient(to right,#2475e818 1px,transparent 1px),linear-gradient(to bottom,#2475e812 1px,transparent 1px);background-size:60px 22.222222px;background-color:#f4f7fb}.node{position:absolute;display:flex;align-items:center;min-width:12px;min-height:12px;padding:3px 7px;border:1px solid transparent;border-radius:6px;color:var(--ink);background:transparent;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:move;touch-action:none}.node.selected{outline:2px solid #2780ff;outline-offset:1px;z-index:2}.node.multi{outline:2px solid #6aa5ff;outline-offset:1px}.node .face{width:100%;height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.node.type-button,.node.type-select,.node.type-input{justify-content:center;border:1px solid #d5dfeb;background:#fff;box-shadow:0 1px 2px #26364d0a}.node.type-button{background:#edf2f8}.node.is-active{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.node.type-select .face:after{content:"⌄";margin-left:auto;padding-left:5px;color:inherit}.node.type-checkbox{gap:6px}.checkmark{display:inline-flex;width:14px;height:14px;flex:none;border:1.5px solid #9aabc0;border-radius:3px;background:#fff;align-items:center;justify-content:center}.node.checked .checkmark{background:var(--blue);border-color:var(--blue);color:white}.node.checked .checkmark:after{content:"✓";font-size:11px;font-weight:bold}.node.type-slider{padding:3px 7px}.slider-track{height:5px;background:#dfe6ef;border-radius:99px;flex:1;position:relative;margin:0 7px}.slider-track i{display:block;height:5px;border-radius:99px;background:var(--blue);width:42%}.slider-track:after{content:"";position:absolute;left:var(--range,40%);top:-4px;width:13px;height:13px;border-radius:50%;border:1px solid #aac4e8;background:#fff}.node.type-card{border:1px solid #dce4ef;background:#fff;box-shadow:0 2px 8px #3448650c;border-radius:9px;padding:12px;font-weight:650;white-space:normal;align-items:flex-start}.node.type-card .face{align-items:flex-start;white-space:pre-wrap;line-height:1.3}.resize-handle{position:absolute;width:9px;height:9px;right:-5px;bottom:-5px;background:#fff;border:2px solid #2780ff;border-radius:2px;cursor:nwse-resize;display:none;z-index:4}.node.selected .resize-handle{display:block}.inspector .side-scroll{padding:11px}.inspector-empty{font-size:12px;color:var(--muted);line-height:1.6;padding:8px 2px}.field{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:7px;margin-bottom:8px}.field>label{font-size:11px;color:#63748a}.field input,.field select,.field textarea{width:100%;min-width:0;min-height:29px;border:1px solid #cbd6e4;border-radius:6px;background:#fff;padding:5px 7px;color:var(--ink);font:inherit;font-size:11px}.field textarea{height:56px;resize:vertical}.field input[type=color]{height:29px;padding:2px}.four{display:grid;grid-template-columns:1fr 1fr;gap:6px}.four .field{grid-template-columns:1fr;gap:3px}.four .field label{font-size:10px}.check-line{display:flex;align-items:center;gap:7px;font-size:12px;margin:7px 0 10px}.check-line input{accent-color:var(--blue)}.inspector-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.inspector-actions button{height:30px;border:1px solid var(--line);border-radius:6px;background:#f9fbfd;font:inherit;font-size:10px;cursor:pointer}.help{font-size:10px;line-height:1.55;color:#8391a4;margin:8px 1px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:7px;background:#22344d;color:white;font-size:12px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}.toast.show{opacity:1}.file-input{display:none}
.sizer:before{content:"";position:absolute;inset:0;border:1px solid #9aa8b8;border-radius:9px;background:#e7ecf3;box-shadow:0 5px 24px #25364d24;pointer-events:none;z-index:0}.node.type-switch{gap:7px}.switch-track{position:relative;display:inline-flex;flex:none;width:34px;height:19px;border-radius:12px;background:#b9c4d2;padding:2px;transition:background .12s}.switch-track:after{content:"";width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #26364d55;transition:transform .12s}.node.checked .switch-track{background:#2475e8}.node.checked .switch-track:after{transform:translateX(15px)}.node.multi .resize-handle{display:none}.multi-bounds{position:absolute;border:1px dashed #1674ed;background:#2475e80b;pointer-events:none;z-index:7}.multi-resize-handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;border:2px solid #1674ed;border-radius:2px;background:#fff;cursor:nwse-resize;pointer-events:auto}.marquee{position:absolute;border:1px solid #1674ed;background:#2475e822;pointer-events:none;z-index:12}.check-line input[type=checkbox]{appearance:none;width:34px;height:19px;border:0;border-radius:12px;background:#b9c4d2;position:relative;cursor:pointer;flex:none}.check-line input[type=checkbox]:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #26364d55;transition:transform .12s}.check-line input[type=checkbox]:checked{background:#2475e8}.check-line input[type=checkbox]:checked:after{transform:translateX(15px)}

<body><div class="app">
<header class="toolbar"><div class="brand">Typing Pad · 界面设计器</div><span class="tool-sep"></span><label for="template">设计样式</label><select class="selectbtn" id="template"><option value="modern">卡片清爽</option><option value="compact">紧凑规整</option></select><button class="toolbtn" id="reset">重置样式</button><span class="tool-sep"></span><label>缩放</label><button class="toolbtn icon" id="zoomOut">−</button><input class="zoom-range" id="zoom" type="range" min="35" max="100" value="65"><button class="toolbtn icon" id="zoomIn">＋</button><span class="zoom-value" id="zoomLabel">65%</span><span class="tool-sep"></span><button class="toolbtn" id="gridToggle">显示网格</button><label><input id="snap" type="checkbox" checked> 吸附</label><label for="previewPage">画布页面</label><select class="selectbtn" id="previewPage"><option value="settings">参数与预览</option><option value="images">图片组管理</option></select><span class="tool-sep"></span><button class="toolbtn icon" title="左对齐" data-align="left">左</button><button class="toolbtn icon" title="水平居中" data-align="centerX">中</button><button class="toolbtn icon" title="右对齐" data-align="right">右</button><button class="toolbtn icon" title="顶对齐" data-align="top">上</button><button class="toolbtn icon" title="垂直居中" data-align="centerY">中</button><button class="toolbtn icon" title="底对齐" data-align="bottom">下</button><button class="toolbtn" id="sameWidth">统一宽</button><button class="toolbtn" id="sameHeight">统一高</button><span class="toolbar-spacer"></span><span class="status" id="saveState">● 本机自动保存</span><button class="toolbtn" id="importBtn">导入 JSON</button><button class="toolbtn" id="exportBtn">导出 JSON</button><input class="file-input" id="fileInput" type="file" accept="application/json,.json"></header>
<main class="workarea"><aside class="side"><div class="side-title">添加元素 <span style="font-size:10px;color:#8a98aa;font-weight:400">可拖动</span></div><div class="side-scroll"><div class="addgrid"><button data-add="text">＋ 文字</button><button data-add="button">＋ 按钮</button><button data-add="input">＋ 输入框</button><button data-add="select">＋ 下拉框</button><button data-add="slider">＋ 滑条</button><button data-add="switch">＋ 开关</button><button data-add="card">＋ 卡片</button><button id="deleteSelected">删除所选</button></div><div class="section-label">图层 · Shift 多选</div><div class="layers" id="layers"></div><p class="help">空白处拖框全选；Shift 拖框追加。多选可整体移动/缩放；方向键微移，Shift 加速。Ctrl+Z/Y 撤销重做，Ctrl+X/C/V 剪切复制粘贴。右侧可以切换组件类型、文字和样式。</p></div></aside><section class="stage-wrap"><div class="sizer" id="sizer"><div class="board" id="board"></div></div></section><aside class="inspector"><div class="side-title">元素属性 <span id="selectedCount" style="font-size:10px;color:#8997a9;font-weight:400">未选中</span></div><div class="side-scroll" id="inspectorBody"><div class="inspector-empty">选中画布中的元素后，可编辑类型、文字、位置、大小、颜色和组件内容。所有调整保存在当前浏览器。</div></div></aside></main></div><div class="toast" id="toast"></div>

function templateData(kind){const bytes=Uint8Array.from(atob(DEFAULT_TEMPLATE_B64),c=>c.charCodeAt(0)),d=JSON.parse(new TextDecoder('utf-8').decode(bytes));d.template=kind;const compact=kind==='compact';for(const q of d.items){if(q.type==='card')q.radius=compact?Math.min(Number(q.radius||8),8):(q.radius??10);else if(['button','input','select'].includes(q.type))q.radius=compact?6:(q.radius??8)}return d}

function loadModel(kind){activeTemplate=kind;try{model=JSON.parse(localStorage.getItem(storeKey+':'+kind))||templateData(kind)}catch{model=templateData(kind)}model.template=kind;syncIdSeq();selected.clear();resetHistory();$('template').value=kind;render();say('已载入「'+(kind==='modern'?'卡片清爽':'紧凑规整')+'」样式')}
function syncIdSeq(){idSeq=1;for(const q of model.items||[]){const m=/^e(\d+)$/.exec(q.id||'');if(m)idSeq=Math.max(idSeq,Number(m[1])+1)}}function resetHistory(){history=[JSON.stringify(model)];historyIndex=0}function recordHistory(){const state=JSON.stringify(model);if(historyIndex>=0&&history[historyIndex]===state)return;history=history.slice(0,historyIndex+1);history.push(state);if(history.length>100)history.shift();historyIndex=history.length-1}function save(record=true){if(record)recordHistory();localStorage.setItem(storeKey+':'+activeTemplate,JSON.stringify(model));$('saveState').textContent='● 已保存在本机';clearTimeout(saveTimer);saveTimer=setTimeout(()=>$('saveState').textContent='● 本机自动保存',1300)}function travelHistory(direction){const target=historyIndex+direction;if(target<0||target>=history.length)return false;historyIndex=target;model=JSON.parse(history[historyIndex]);syncIdSeq();selected=new Set([...selected].filter(id=>model.items.some(q=>q.id===id)));render();save(false);return true}function copySelected(cut=false){const items=model.items.filter(q=>selected.has(q.id));if(!items.length)return false;clipboardItems=items.map(q=>({...q}));if(cut){model.items=model.items.filter(q=>!selected.has(q.id));selected.clear();render();save();say('已剪切选中元素')}else say('已复制选中元素');return true}function pasteSelected(){if(!clipboardItems.length)return false;const copies=clipboardItems.map(q=>({...q,id:'e'+idSeq++})),minX=Math.min(...copies.map(q=>q.x)),minY=Math.min(...copies.map(q=>q.y)),maxX=Math.max(...copies.map(q=>q.x+q.w)),maxY=Math.max(...copies.map(q=>q.y+q.h));let dx=60,dy=H/45;dx=Math.max(-minX,Math.min(W-maxX,dx));dy=Math.max(-minY,Math.min(H-maxY,dy));for(const q of copies){q.x+=dx;q.y+=dy;if(q.page&&q.page!=='all')q.page=activePage;model.items.push(q)}selected=new Set(copies.map(q=>q.id));render();save();say('已粘贴元素');return true}function moveSelectedBy(dx,dy){const items=model.items.filter(q=>selected.has(q.id)&&(!q.page||q.page==='all'||q.page===activePage));if(!items.length)return false;const minX=Math.min(...items.map(q=>q.x)),minY=Math.min(...items.map(q=>q.y)),maxX=Math.max(...items.map(q=>q.x+q.w)),maxY=Math.max(...items.map(q=>q.y+q.h));dx=Math.max(-minX,Math.min(W-maxX,dx));dy=Math.max(-minY,Math.min(H-maxY,dy));for(const q of items){q.x+=dx;q.y+=dy}render();save();return true}function focusIsTextEntry(){const el=document.activeElement;return ['INPUT','TEXTAREA','SELECT'].includes(el?.tagName)||!!el?.isContentEditable}
function render(){board.innerHTML='';board.style.backgroundColor=model.bg||'#f4f7fb';board.style.setProperty('--blue',model.appearance?.accent||'#2475e8');board.classList.toggle('compact',activeTemplate==='compact');for(const it of model.items){if(it.page&&it.page!=='all'&&it.page!==activePage)continue;const n=document.createElement('div');n.className='node type-'+it.type+(it.active?' is-active':'')+(it.checked?' checked':'')+(selected.has(it.id)?' selected':'')+(selected.size>1&&selected.has(it.id)?' multi':'');n.dataset.id=it.id;n.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;font-size:${it.font||13}px;color:${it.color||'#26364d'};background:${it.bg||'transparent'};border-color:${it.border||'transparent'};border-radius:${it.radius??6}px;`;const f=document.createElement('div');f.className='face';if(it.type==='switch'){const l=document.createElement('span');l.textContent=it.text;f.append(l);const m=document.createElement('span');m.className='switch-track';f.append(m)}else if(it.type==='slider'){f.textContent=it.text+' ';const tr=document.createElement('span');tr.className='slider-track';const fill=document.createElement('i');const pct=Math.max(0,Math.min(100,((Number(it.value)-Number(it.min))/(Number(it.max)-Number(it.min)||1))*100));fill.style.width=pct+'%';tr.style.setProperty('--range',pct+'%');tr.append(fill);f.append(tr);f.append(document.createTextNode(' '+(it.placeholder?(it.placeholderText||'【占位符】'):it.value)))}else{f.textContent=it.text||'';if(it.type==='card')f.style.whiteSpace='pre-wrap'}n.append(f);const h=document.createElement('span');h.className='resize-handle';n.append(h);board.append(n);n.addEventListener('pointerdown',e=>pointerDown(e,it,n));n.addEventListener('dblclick',e=>{e.stopPropagation();if(it.type==='button'&&(it.text==='参数与预览'||it.text==='图片组管理')){activePage=it.text==='图片组管理'?'images':'settings';$('previewPage').value=activePage;render();return}if(['text','button','input','select','card'].includes(it.type)){c function boardPoint(e){const r=board.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}function beginMarquee(e){if(e.button!==0)return;e.preventDefault();const p=boardPoint(e);const base=e.shiftKey?new Set(selected):new Set();marquee={sx:p.x,sy:p.y,base,moved:false};const box=document.createElement('div');box.className='marquee';box.id='activeMarquee';board.append(box);window.addEventListener('pointermove',moveMarquee);window.addEventListener('pointerup',endMarquee,{once:true})}function moveMarquee(e){if(!marquee)return;const p=boardPoint(e),l=Math.min(p.x,marquee.sx),t=Math.min(p.y,marquee.sy),r=Math.max(p.x,marquee.sx),b=Math.max(p.y,marquee.sy);marquee.moved=Math.abs(p.x-marquee.sx)+Math.abs(p.y-marquee.sy)>2;const box=$('activeMarquee');if(box)box.style.cssText=`left:${l}px;top:${t}px;width:${r-l}px;height:${b-t}px`;selected=new Set(marquee.base);if(marquee.moved)for(const it of model.items){if(it.page&&it.page!=='all'&&it.page!==activePage)continue;if(it.x+it.w>=l&&it.x<=r&&it.y+it.h>=t&&it.y<=b)selected.add(it.id)}board.querySelectorAll('.node').forEach(n=>{n.classList.toggle('selected',selected.has(n.dataset.id));n.classList.toggle('multi',selected.size>1&&selected.has(n.dataset.id))});updateLayers();renderInspector()}function endMarquee(){window.removeEventListener('pointermove',moveMarquee);const box=$('activeMarquee');if(box)box.remove();if(marquee&&!marquee.moved)selected=new Set(marquee.base);marquee=null;render()}function startGroupResize(e,items){if(e.button!==0)return;e.preventDefault();e.stopPropagation();const orig=items.map(q=>({id:q.id,x:q.x,y:q.y,w:q.w,h:q.h})),minX=Math.min(...orig.map(q=>q.x)),minY=Math.min(...orig.map(q=>q.y)),maxX=Math.max(...orig.map(q=>q.x+q.w)),maxY=Math.max(...orig.map(q=>q.y+q.h));drag={groupResize:true,sx:e.clientX,sy:e.clientY,orig,minX,minY,bw:maxX-minX,bh:maxY-minY};window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
function pointerDown(e,it,node){if(e.button!==0)return;e.preventDefault();e.stopPropagation();const resize=e.target.classList.contains('resize-handle');if(e.shiftKey){if(selected.has(it.id)){selected.delete(it.id);drag=null;board.querySelectorAll('.node').forEach(n=>{n.classList.toggle('selected',selected.has(n.dataset.id));n.classList.toggle('multi',selected.size>1&&selected.has(n.dataset.id))});updateLayers();renderInspector();return}else selected.add(it.id)}else if(!selected.has(it.id)){selected.clear();selected.add(it.id)}drag={id:it.id,sx:e.clientX,sy:e.clientY,x:it.x,y:it.y,w:it.w,h:it.h,resize,ids:[...selected],orig:[...selected].map(id=>{const q=model.items.find(z=>z.id===id);return{id,x:q.x,y:q.y,w:q.w,h:q.h}})};board.querySelectorAll('.node').forEach(n=>{n.classList.toggle('selected',selected.has(n.dataset.id));n.classList.toggle('multi',selected.size>1&&selected.has(n.dataset.id))});updateLayers();renderInspector();window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true})}
function snap(v,step){return $('snap').checked?Math.round(v/step)*step:v}function moveDrag(e){if(!drag)return;const dx=(e.clientX-drag.sx)/zoom,dy=(e.clientY-drag.sy)/zoom;if(drag.groupResize){const nw=Math.max(24,Math.min(W-drag.minX,drag.bw+snap(dx,60))),nh=Math.max(20,Math.min(H-drag.minY,drag.bh+snap(dy,H/45))),sx=nw/(drag.bw||1),sy=nh/(drag.bh||1);for(const q of drag.orig){const it=model.items.find(z=>z.id===q.id);if(it){it.x=drag.minX+(q.x-drag.minX)*sx;it.y=drag.minY+(q.y-drag.minY)*sy;it.w=Math.max(12,q.w*sx);it.h=Math.max(12,q.h*sy)}}render();return}const it=model.items.find(q=>q.id===drag.id);if(!it)return;if(drag.resize){it.w=Math.max(24,snap(drag.w+dx,10));it.h=Math.max(18,snap(drag.h+dy,10))}else if(drag.ids.length===1){it.x=Math.max(0,Math.min(W-it.w,snap(drag.x+dx,60)));it.y=Math.max(0,Math.min(H-it.h,snap(drag.y+dy,H/45)))}else{const nx=snap(drag.x+dx,60),ny=snap(drag.y+dy,H/45),minX=Math.min(...drag.orig.map(q=>q.x)),minY=Math.min(...drag.orig.map(q=>q.y)),maxX=Math.max(...drag.orig.map(q=>q.x+q.w)),maxY=Math.max(...drag.orig.map(q=>q.y+q.h)),mx=Math.max(-minX,Math.min(W-maxX,nx-drag.x)),my=Math.max(-minY,Math.min(H-maxY,ny-drag.y));for(const q of drag.orig){const x=model.items.find(z=>z.id===q.id);x.x=q.x+mx;x.y=q.y+my}}render()}function endDrag(){window.removeEventListener('pointermove',moveDrag);if(drag){drag=null;save()}}
function updateLayers(){layers.innerHTML='';for(const it of model.items){const b=document.createElement('button');b.className='layer'+(selected.has(it.id)?' selected':'');b.textContent=(names[it.type]||it.type)+' · '+(it.text||'（空）');b.title=b.text;b.onclick=e=>{if(e.shiftKey){selected.has(it.id)?selected.delete(it.id):selected.add(it.id)}else{selected.clear();selected.add(it.id)}render()};layers.append(b)}}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function field(label,key,value,type='number',attrs={}){return `<div class="field"><label>${label}</label><input data-prop="${key}" type="${type}" value="${esc(value)}" ${Object.entries(attrs).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')}></div>`}function safeColor(v){return /^#[\da-f]{6}$/i.test(v||'')?v:'#ffffff'}
function renderInspector(){const body=$('inspectorBody');$('selectedCount').textContent=selected.size?`已选 ${selected.size} 项`:'未选中';if(selected.size!==1){body.innerHTML=`<div class="inspector-empty">${selected.size>1?'多选元素可一起移动、对齐或统一宽高。':'选中画布元素后，编辑类型、文字、位置、尺寸和样式。'}<br><br>按 Shift 多选；拖动移动，拖右下角缩放。</div>`;return}const it=model.items.find(q=>q.id===[...selected][0]);if(!it)return;let h=`<div class="field"><label>组件类型</label><select data-prop="type">${Object.entries(names).map(([k,v])=>`<option value="${k}" ${it.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>文字 / 内容</label><textarea data-prop="text">${esc(it.text)}</textarea></div><div class="four">${field('X 位置','x',it.x)}${field('Y 位置','y',it.y)}${field('宽度','w',it.w)}${field('高度','h',it.h)}</div><div class="four">${field('字号','font',it.font)}${field('圆角','radius',it.radius)}</div><div class="four">${field('文字颜色','color',safeColor(it.color),'color')}${field('背景颜色','bg',safeColor(it.bg),'color')}${field('边框颜色','border',safeColor(it.border),'color')}</div>`;if(it.type==='select')h+=`<div class="field"><label>下拉选项</label><textarea data-prop="options">${esc(it.options)}</textarea></div>`;if(it.type==='switch')h+=`<label class="check-line"><input type="checkbox" data-prop="checked" ${it.checked?'checked':''}> 开关默认开启</label>`;if(it.type==='slider')h+=`<div class="four">${field('最小值','min',it.min)}${field('最大值','max',it.max)}${field('步进','step',it.step)}${field('当前值','value',it.value)}</div>`;if(it.type==='slider'&&it.placeholder)h+=`<div class="field"><label>显示文字</label><input data-prop="placeholderText" value="${esc(it.placeholderText||'【占位符】')}"></div>`;h+='<div class="inspector-actions"><button data-action="front">置于顶层</button><button data-action="back">置于底层</button><button data-action="duplicate">复制元素</button><button data-action="delete">删除元素</button></div><p class="help">Shift 点击多选；工具栏可按边缘或中心对齐，并统一宽度和高度。</p>';body.innerHTML=h;body.querySelectorAll('[data-prop]').forEach(c=>{co function changeType(it,t){it.type=t;if(t==='select')it.options||='选项一,选项二';if(t==='slider'){it.min??=0;it.max??=100;it.value??=50;it.step??=1}if(t==='card'&&it.bg==='transparent'){it.bg='#fff';it.border='#dce4ef'}render();save()}function itemAction(it,a){const i=model.items.indexOf(it);if(a==='delete'){model.items.splice(i,1);selected.delete(it.id)}else if(a==='duplicate'){const q={...it,id:'e'+idSeq++,x:it.x+20,y:it.y+20};model.items.splice(i+1,0,q);selected.clear();selected.add(q.id)}else{model.items.splice(i,1);model.items[a==='front'?'push':'unshift'](it)}render();save()}
function add(t){const text={text:'新文字',button:'新按钮',input:'请输入',select:'选项一',slider:'滑条',switch:'开关项',card:'新卡片'}[t],q=el(t,text,450,440,t==='card'?260:150,t==='card'?100:34,{bg:t==='card'?'#fff':t==='button'?'#edf2f8':'transparent',border:['card','button','input','select'].includes(t)?'#d5dfeb':'transparent'});model.items.push(q);selected.clear();selected.add(q.id);render();save()}
function align(mode){const a=model.items.filter(i=>selected.has(i.id));if(a.length<2)return say('至少选两个元素再对齐');const l=Math.min(...a.map(i=>i.x)),r=Math.max(...a.map(i=>i.x+i.w)),t=Math.min(...a.map(i=>i.y)),b=Math.max(...a.map(i=>i.y+i.h));for(const i of a){if(mode==='left')i.x=l;if(mode==='right')i.x=r-i.w;if(mode==='centerX')i.x=l+(r-l-i.w)/2;if(mode==='top')i.y=t;if(mode==='bottom')i.y=b-i.h;if(mode==='centerY')i.y=t+(b-t-i.h)/2}render();save()}function sameSize(k){const a=model.items.filter(i=>selected.has(i.id));if(a.length<2)return say('至少选择两个元素');for(const i of a)i[k]=a[0][k];render();save()}function say(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
